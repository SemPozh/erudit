erudit.pagination.default-size=20
erudit.pagination.max-size=50
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.internal.sliding-window-size=10
resilience4j.circuitbreaker.instances.internal.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.internal.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.internal.wait-duration-in-open-state=10s
resilience4j.retry.instances.internal.max-attempts=1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
eureka.client.healthcheck.enabled=true
eureka.client.should-unregister-on-shutdown=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
