server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erudit_content}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Each service owns a fresh Flyway history; never baseline a legacy monolith schema.
  flyway:
    baseline-on-migrate: false