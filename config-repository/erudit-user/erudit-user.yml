server:
  port: ${SERVER_PORT:8082}

erudit:
  jwt:
    secret: ${JWT_SECRET}
    issuer: erudit-user
    ttl: 1h

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erudit_user}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    # Each service owns a fresh Flyway history; never baseline a legacy monolith schema.
    baseline-on-migrate: false
