server.port=${SERVER_PORT:8080}
erudit.gateway.allowed-origins=${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# 50 MiB file plus multipart overhead; whole requests are bounded before forwarding.
erudit.gateway.max-body-bytes=${GATEWAY_MAX_BODY_BYTES:54525952}
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Admin
springdoc.swagger-ui.urls[0].url=/swagger/admin/openapi.yaml
springdoc.swagger-ui.urls[1].name=AI Platform
springdoc.swagger-ui.urls[1].url=/swagger/ai/openapi.yaml
springdoc.swagger-ui.urls[2].name=Content
springdoc.swagger-ui.urls[2].url=/swagger/content/openapi.yaml
springdoc.swagger-ui.urls[3].name=Events
springdoc.swagger-ui.urls[3].url=/swagger/events/openapi.yaml
springdoc.swagger-ui.urls[4].name=Notifications
springdoc.swagger-ui.urls[4].url=/swagger/notifications/openapi.yaml
springdoc.swagger-ui.urls[5].name=Payment
springdoc.swagger-ui.urls[5].url=/swagger/payment/openapi.yaml
springdoc.swagger-ui.urls[6].name=Quiz
springdoc.swagger-ui.urls[6].url=/swagger/quiz/openapi.yaml
springdoc.swagger-ui.urls[7].name=User
springdoc.swagger-ui.urls[7].url=/swagger/user/openapi.yaml
springdoc.swagger-ui.urls-primary-name=Content
