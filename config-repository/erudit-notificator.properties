server.port=${SERVER_PORT:8088}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erudit_notification}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
erudit.notifications.jdbc-threads=${NOTIFICATION_JDBC_THREADS:4}
erudit.notifications.jdbc-queue=${NOTIFICATION_JDBC_QUEUE:256}
erudit.notifications.daily-limit=${NOTIFICATION_DAILY_LIMIT:10}
erudit.notifications.quiet-start=${NOTIFICATION_QUIET_START:22}
erudit.notifications.quiet-end=${NOTIFICATION_QUIET_END:8}
erudit.notifications.trigger-cron=${NOTIFICATION_TRIGGER_CRON:0 */5 * * * *}
