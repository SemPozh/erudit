server.port=${SERVER_PORT:8085}
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/erudit_event}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}
spring.sql.init.mode=never
# Flyway uses a short-lived JDBC connection during startup; requests remain R2DBC.
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/erudit_event}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
# Previous event releases used IF NOT EXISTS schema.sql, with no history.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
erudit.events.pipeline-buffer=${EVENT_PIPELINE_BUFFER:1024}
erudit.events.batch-size=${EVENT_BATCH_SIZE:100}
erudit.events.clickhouse-retries=${CLICKHOUSE_RETRIES:3}
erudit.clickhouse.url=${CLICKHOUSE_URL:http://localhost:8123}
erudit.clickhouse.username=${CLICKHOUSE_USERNAME}
erudit.clickhouse.password=${CLICKHOUSE_PASSWORD}
