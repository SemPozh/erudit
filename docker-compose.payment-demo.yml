# Explicit, disposable payment demo database; the normal payment volume is preserved.
services:
  payment-service:
    environment:
      SPRING_PROFILES_ACTIVE: demo
      PAYMENT_WEBHOOK_SECRET: local-webhook-secret
      DB_URL: jdbc:postgresql://payment-demo-postgres:5432/erudit_payment_demo
      DB_USERNAME: erudit_payment_demo
      DB_PASSWORD: erudit_payment_demo
    depends_on:
      payment-demo-postgres: {condition: service_healthy}
  payment-demo-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudit_payment_demo
      POSTGRES_USER: erudit_bootstrap
      POSTGRES_PASSWORD: local-payment-demo-bootstrap
      APP_DB_USER: erudit_payment_demo
      APP_DB_PASSWORD: erudit_payment_demo
    volumes: [./docker/postgres/init-domain.sh:/docker-entrypoint-initdb.d/10-domain.sh:ro]
    tmpfs: [/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$APP_DB_PASSWORD" psql -h 127.0.0.1 -U "$$APP_DB_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
