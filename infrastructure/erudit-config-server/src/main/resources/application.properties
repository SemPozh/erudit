spring.application.name=erudit-config-server
server.port=${SERVER_PORT:8888}
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPOSITORY_LOCATION:file:./config-repository/}
spring.cloud.config.server.accept-empty=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
eureka.client.healthcheck.enabled=true
eureka.client.should-unregister-on-shutdown=true
# Config Server must become ready before Eureka can fetch its configuration.
management.health.discovery-composite.enabled=false
