spring.application.name=erudit-config-server
server.port=${SERVER_PORT:8888}
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPOSITORY_LOCATION:file:./config-repository/}
spring.cloud.config.server.accept-empty=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
