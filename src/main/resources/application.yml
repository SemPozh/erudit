spring:
  application:
    name: erudit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erudit}
    username: ${DB_USERNAME:erudit}
    password: ${DB_PASSWORD:erudit}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:50MB}
      max-request-size: ${MEDIA_MAX_FILE_SIZE:50MB}
  security:
    csrf:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: ${ZIPKIN_ENABLED:false}
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  observations:
    key-values:
      service: ${spring.application.name}

clickhouse:
  url: ${CLICKHOUSE_URL:jdbc:clickhouse:http://localhost:8123/erudit}
  username: ${CLICKHOUSE_USERNAME:erudit}
  password: ${CLICKHOUSE_PASSWORD:erudit}

events:
  publisher:
    workers: ${EVENT_PUBLISHER_WORKERS:2}
    queue-capacity: ${EVENT_PUBLISHER_QUEUE_CAPACITY:1000}

media:
  storage-path: ${MEDIA_STORAGE_PATH:./data/media}
  max-size-bytes: ${MEDIA_MAX_SIZE_BYTES:52428800}

springdoc:
  swagger-ui:
    url: /openapi.yaml
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
erudit:
  auth:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${JWT_REFRESH_TTL:P30D}
    password-reset:
      base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:8080}
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT1H}
    verification:
      base-url: ${VERIFICATION_BASE_URL:http://localhost:8080}
      token-ttl: PT24H
