spring:
  application:
    name: erudit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erudit}
    username: ${DB_USERNAME:erudit}
    password: ${DB_PASSWORD:erudit}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: ${ZIPKIN_ENABLED:false}
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  observations:
    key-values:
      service: ${spring.application.name}

clickhouse:
  url: ${CLICKHOUSE_URL:jdbc:clickhouse:http://localhost:8123/erudit}
  username: ${CLICKHOUSE_USERNAME:erudit}
  password: ${CLICKHOUSE_PASSWORD:erudit}

springdoc:
  swagger-ui:
    url: /openapi.yaml
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
