- name: ContentModeration
  description: Модерация контента
- name: Media
  description: Загрузка и выдача медиа
- name: Assessment
  description: Входное тестирование
- name: Programs
  description: Персональная программа обучения
- name: Quizzes
  description: Квизы
- name: Competitions
  description: Соревнования
- name: Ratings
  description: Рейтинги
- name: Friends
  description: Друзья
- name: Subscriptions
  description: Подписки
- name: Payments
  description: Платежи
- name: Notifications
  description: Уведомления
- name: NotificationAdmin
