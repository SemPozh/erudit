      type: object
      properties:
        data:
          type: string
          example: Hello, World!
      required:
      - data
    ContentReportRequest:
      type: object
      properties:
        reason:
          type: string
          example: В материале есть фактическая ошибка
      required:
      - reason
    ReportCreatedResponse:
      type: object
      properties:
        data: *id001
      required:
      - data
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      required:
