services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: erudit:latest
    container_name: erudit
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    restart: unless-stopped