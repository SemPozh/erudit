name: erudit

services:
  config-server:
    build:
      context: .
      dockerfile: infrastructure/erudit-config-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPOSITORY_LOCATION: file:/config-repository/
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - ./config-repository:/config-repository:ro
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: :infrastructure:erudit-discovery-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: :infrastructure:erudit-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    networks:
      - edge
      - internal
    ports:
      - "${GATEWAY_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  content-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: :services:erudit-content
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://content-postgres:5432/erudit_content
      DB_USERNAME: ${CONTENT_DB_USER:-erudit_content}
      DB_PASSWORD: ${CONTENT_DB_PASSWORD:-erudit_content}
      MEDIA_STORAGE_PATH: /app/data/media
    networks:
      - internal
    volumes:
      - content_media_data:/app/data/media
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      content-postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  content-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudit_content
      POSTGRES_USER: ${CONTENT_DB_USER:-erudit_content}
      POSTGRES_PASSWORD: ${CONTENT_DB_PASSWORD:-erudit_content}
    volumes:
      - content_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTENT_DB_USER:-erudit_content} -d erudit_content"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  event-receiver:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { MODULE: ":services:erudit-event-receiver" }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      R2DBC_URL: r2dbc:postgresql://event-postgres:5432/erudit_event
      DB_USERNAME: ${EVENT_DB_USER:-erudit_event}
      DB_PASSWORD: ${EVENT_DB_PASSWORD:-erudit_event}
      CLICKHOUSE_URL: http://event-clickhouse:8123/erudit_events
      CLICKHOUSE_USERNAME: ${EVENT_CLICKHOUSE_USER:-erudit_event}
      CLICKHOUSE_PASSWORD: ${EVENT_CLICKHOUSE_PASSWORD:-erudit_event}
    networks: [internal]
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      event-postgres: {condition: service_healthy}
      event-clickhouse: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  event-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudit_event
      POSTGRES_USER: ${EVENT_DB_USER:-erudit_event}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:-erudit_event}
    volumes: [event_postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENT_DB_USER:-erudit_event} -d erudit_event"]
      interval: 5s
      timeout: 3s
      retries: 20

  event-clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: erudit_events
      CLICKHOUSE_USER: ${EVENT_CLICKHOUSE_USER:-erudit_event}
      CLICKHOUSE_PASSWORD: ${EVENT_CLICKHOUSE_PASSWORD:-erudit_event}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [event_clickhouse_data:/var/lib/clickhouse]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  notificator:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { MODULE: ":services:erudit-notificator" }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://notification-postgres:5432/erudit_notification
      DB_USERNAME: ${NOTIFICATION_DB_USER:-erudit_notification}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-erudit_notification}
    networks: [internal]
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      notification-postgres: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  notification-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudit_notification
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-erudit_notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-erudit_notification}
    volumes: [notification_postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-erudit_notification} -d erudit_notification"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway-echo:
    profiles: [gateway-smoke]
    image: python:3.13-alpine
    command: ["python", "/echo.py"]
    volumes:
      - ./scripts/fixtures/gateway-echo.py:/echo.py:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  ai-platform:
    profiles: [discovery-smoke]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: :services:erudit-ai-platform
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    networks:
      - internal
    depends_on:
      discovery-server:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: {MODULE: ":services:erudit-user"}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://user-postgres:5432/erudit_user
      DB_USERNAME: ${USER_DB_USER:-erudit_user}
      DB_PASSWORD: ${USER_DB_PASSWORD:-erudit_user}
    networks: [internal]
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      user-postgres: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  user-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudit_user
      POSTGRES_USER: ${USER_DB_USER:-erudit_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-erudit_user}
    volumes: [user_postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-erudit_user} -d erudit_user"]
      interval: 5s
      timeout: 3s
      retries: 20

  quiz-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: {MODULE: ":services:erudit-quiz"}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://quiz-postgres:5432/erudit_quiz
      DB_USERNAME: ${QUIZ_DB_USER:-erudit_quiz}
      DB_PASSWORD: ${QUIZ_DB_PASSWORD:-erudit_quiz}
    networks: [internal]
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      quiz-postgres: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  quiz-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudit_quiz
      POSTGRES_USER: ${QUIZ_DB_USER:-erudit_quiz}
      POSTGRES_PASSWORD: ${QUIZ_DB_PASSWORD:-erudit_quiz}
    volumes: [quiz_postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QUIZ_DB_USER:-erudit_quiz} -d erudit_quiz"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: {MODULE: ":services:erudit-payment"}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://payment-postgres:5432/erudit_payment
      DB_USERNAME: ${PAYMENT_DB_USER:-erudit_payment}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-erudit_payment}
    networks: [internal]
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      payment-postgres: {condition: service_healthy}
      user-service: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  payment-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erudit_payment
      POSTGRES_USER: ${PAYMENT_DB_USER:-erudit_payment}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-erudit_payment}
    volumes: [payment_postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-erudit_payment} -d erudit_payment"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: [legacy]
    build:
      context: .
      dockerfile: Dockerfile
    image: erudit:latest
    container_name: erudit
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erudit}
      DB_USERNAME: ${POSTGRES_USER:-erudit}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-erudit}
      CLICKHOUSE_URL: jdbc:clickhouse:http://clickhouse:8123/${CLICKHOUSE_DB:-erudit}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-erudit}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-erudit}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      ZIPKIN_ENABLED: ${ZIPKIN_ENABLED:-false}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://host.docker.internal:9411/api/v2/spans}
      MEDIA_STORAGE_PATH: /app/data/media
      MEDIA_MAX_SIZE_BYTES: ${MEDIA_MAX_SIZE_BYTES:-52428800}
      MEDIA_MAX_FILE_SIZE: ${MEDIA_MAX_FILE_SIZE:-50MB}
      NOTIFICATION_DAILY_LIMIT: ${NOTIFICATION_DAILY_LIMIT:-10}
      NOTIFICATION_TRIGGER_CRON: ${NOTIFICATION_TRIGGER_CRON:-0 0 * * * *}
    volumes:
      - media_data:/app/data/media
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    profiles: [legacy]
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erudit}
      POSTGRES_USER: ${POSTGRES_USER:-erudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erudit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erudit} -d ${POSTGRES_DB:-erudit}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clickhouse:
    profiles: [legacy]
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-erudit}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-erudit}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-erudit}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - internal
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-erudit}", "--password", "${CLICKHOUSE_PASSWORD:-erudit}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  payment_postgres_data:
  user_postgres_data:
  quiz_postgres_data:
  event_clickhouse_data:
  event_postgres_data:
  notification_postgres_data:
  content_media_data:
  content_postgres_data:
  postgres_data:
  clickhouse_data:
  media_data:

networks:
  edge:
    name: erudit-edge
  internal:
    name: erudit-internal
    internal: true
