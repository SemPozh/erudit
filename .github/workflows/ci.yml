name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  module_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: root, module: ":"}
          - {id: user, module: ":services:erudit-user:"}
          - {id: content, module: ":services:erudit-content:"}
          - {id: quiz, module: ":services:erudit-quiz:"}
          - {id: event-receiver, module: ":services:erudit-event-receiver:"}
          - {id: ai-platform, module: ":services:erudit-ai-platform:"}
          - {id: notificator, module: ":services:erudit-notificator:"}
          - {id: payment, module: ":services:erudit-payment:"}
          - {id: admin, module: ":services:erudit-admin:"}
          - {id: gateway, module: ":infrastructure:erudit-gateway:"}
          - {id: config-server, module: ":infrastructure:erudit-config-server:"}
          - {id: discovery-server, module: ":infrastructure:erudit-discovery-server:"}
          - {id: integration, module: ":platform:erudit-integration:"}
          - {id: observability, module: ":platform:erudit-observability:"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew "${{ matrix.module }}test" "${{ matrix.module }}check"
      - name: Validate every contract
        if: matrix.id == 'root'
        run: ./gradlew openApiValidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.id }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
            **/build/reports/jacoco/**
          retention-days: 7

  test:
    needs: module_tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every module test and coverage check
        run: test '${{ needs.module_tests.result }}' = 'success'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew bootJar

  infrastructure-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose --profile legacy config --quiet
      - name: Start, restart and verify infrastructure
        shell: pwsh
        run: ./scripts/smoke-infrastructure.ps1
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color config-server discovery-server gateway
      - name: Stop infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans


  demo-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Reset disposable demo stack
        shell: pwsh
        run: ./scripts/reset-demo.ps1 -Project erudit-demo-ci -Port 18089
      - name: Verify public HTTP contracts and fixtures
        shell: pwsh
        run: ./scripts/smoke-demo-contracts.ps1
      - name: Stop demo applications before normal-profile smoke
        run: docker compose -p erudit-demo-ci -f docker-compose.yml -f docker-compose.demo.yml --profile demo stop
      - name: Verify normal Compose startup and restart
        shell: pwsh
        run: ./scripts/smoke-platform.ps1 -ImageProject erudit-demo-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-contract-results
          path: build/demo-contract-results.xml
      - name: Collect failed demo logs
        if: failure()
        run: docker compose -p erudit-demo-ci -f docker-compose.yml -f docker-compose.demo.yml --profile demo logs --tail 100
      - name: Remove disposable demo stack
        if: always()
        run: docker compose -p erudit-demo-ci -f docker-compose.yml -f docker-compose.demo.yml --profile demo down --volumes --remove-orphans
