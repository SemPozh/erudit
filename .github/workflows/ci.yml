name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.impact.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify conservative impact graph
        run: python scripts/test_ci_plan.py
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "matrix=$(python scripts/ci-plan.py --base "$BASE_SHA" --head HEAD)" >> "$GITHUB_OUTPUT"

  module_tests:
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew "${{ matrix.module }}test" "${{ matrix.module }}check"
      - name: Validate every contract
        if: matrix.id == 'root'
        run: ./gradlew openApiValidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.id }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
            **/build/reports/jacoco/**
          retention-days: 7

  test:
    needs: [plan, module_tests, build, infrastructure-smoke, system-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every module test and coverage check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os; assert all(j['result']=='success' for j in json.loads(os.environ['RESULTS']).values())"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew assemble openApiValidate

  infrastructure-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile demo config --quiet
          docker compose -f docker-compose.yml -f docker-compose.debug.yml --profile debug config --quiet
      - name: Start, restart and verify infrastructure
        shell: pwsh
        run: ./scripts/smoke-infrastructure.ps1
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color config-server discovery-server gateway
      - name: Stop infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans


  system-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Reset disposable demo stack
        shell: pwsh
        run: ./scripts/reset-demo.ps1 -Project erudit-demo-ci -Port 18089
      - name: Verify public HTTP contracts and fixtures
        shell: pwsh
        run: ./scripts/smoke-demo-contracts.ps1
      - name: Gateway user journeys and dependency circuit recovery
        shell: pwsh
        run: |
          ./scripts/smoke-e2e.ps1
          ./scripts/smoke-resilience.ps1 -Project erudit-demo-ci
      - name: Stop demo applications before normal-profile smoke
        run: docker compose -p erudit-demo-ci -f docker-compose.yml -f docker-compose.demo.yml --profile demo stop
      - name: Verify normal Compose startup and restart
        shell: pwsh
        run: ./scripts/smoke-platform.ps1 -ImageProject erudit-demo-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-contract-results
          path: |
            build/demo-contract-results.xml
            build/gateway-e2e.xml
            build/gateway-e2e.xml.md
            build/gateway-resilience.md
            build/images-report.json
      - name: Collect failed demo logs
        if: failure()
        run: docker compose -p erudit-demo-ci -f docker-compose.yml -f docker-compose.demo.yml --profile demo logs --tail 100
      - name: Remove disposable demo stack
        if: always()
        run: docker compose -p erudit-demo-ci -f docker-compose.yml -f docker-compose.demo.yml --profile demo down --volumes --remove-orphans
