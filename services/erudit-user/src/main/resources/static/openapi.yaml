openapi: 3.0.3
info: {"title": "Erudit User API", "version": "2.0.0", "description": " Demo fixtures require the demo Compose profile. Reset: ./scripts/reset-demo.ps1. Stateful scenarios and IDs: docs/demo-runbook.md."}
tags: [{name: Users}, {name: User Settings}]
paths:
  /api/v1/users/register:
    post:
      tags: [Users]
      operationId: register
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses: {'201': {description: Registered, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}}
  /api/v1/users/verify:
    post:
      tags: [Users]
      operationId: verifyEmail
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyRequest'}}}}
      responses: {'204': {description: Verified}}
  /api/v1/users:
    get:
      tags: [Users]
      operationId: searchUsers
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses: {'200': {description: Page, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/UserResponse'}}}}}}
  /api/v1/users/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '00000000-0000-0000-0000-000000000001'}}]
    get: {tags: [Users], operationId: getUser, responses: {'200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}}}
    put:
      tags: [Users]
      operationId: updateUser
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUserRequest'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}}
    delete: {tags: [Users], operationId: deleteUser, responses: {'204': {description: Deleted}}}
  /api/v1/friends:
    get:
      tags: [Friends]
      operationId: listFriends
      parameters: [{$ref: '#/components/parameters/UserId'}, {name: page, in: query, schema: {type: integer, default: 0}}, {name: size, in: query, schema: {type: integer, default: 20, maximum: 50}}]
      responses: {'200': {description: Friends, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PublicUserResponse'}}}}}}
  /api/v1/friends/requests:
    post:
      tags: [Friends]
      operationId: requestFriend
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FriendRequest'}}}}
      responses: {'202': {description: Requested}}
  /api/v1/friends/requests/{id}/{decision}:
    post:
      tags: [Friends]
      operationId: decideFriendRequest
      parameters: [{$ref: '#/components/parameters/UserId'}, {name: id, in: path, required: true, schema: {type: string, format: uuid, example: 'f0000000-0000-0000-0000-000000000001'}}, {name: decision, in: path, required: true, schema: {type: string, enum: [accept, reject]}}]
      responses: {'204': {description: Decided}}
  /api/v1/friends/{friendId}:
    delete:
      tags: [Friends]
      operationId: removeFriend
      parameters: [{$ref: '#/components/parameters/UserId'}, {name: friendId, in: path, required: true, schema: {type: string, format: uuid, example: '00000000-0000-0000-0000-000000000002'}}]
      responses: {'204': {description: Removed}}
  /api/v1/devices:
    post:
      tags: [Devices]
      operationId: registerDevice
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRequest'}}}}
      responses: {'201': {description: Device, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceResponse'}}}}}
  /api/v1/devices/{id}:
    delete:
      tags: [Devices]
      operationId: revokeDevice
      parameters: [{$ref: '#/components/parameters/UserId'}, {name: id, in: path, required: true, schema: {type: string, format: uuid, example: 'd0000000-0000-0000-0000-000000000001'}}]
      responses: {'204': {description: Revoked}}
  /api/v1/users/{id}/settings:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '00000000-0000-0000-0000-000000000001'}}]
    get: {tags: [User Settings], operationId: getSettings, responses: {'200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsResponse'}}}}}}
    put:
      tags: [User Settings]
      operationId: updateSettings
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsRequest'}}}}
      responses: {'200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsResponse'}}}}}
  /internal/v1/users/{id}:
    get:
      tags:
      - Internal Users
      operationId: lookupUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User exists (unverified lab context)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookupResponse'
        '404':
          description: User not found
  /internal/v1/admin/users:
    get:
      tags: [Internal Users]
      operationId: adminSearchUsers
      parameters: [{name: query, in: query, schema: {type: string}}, {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}]
      responses: {'200': {description: User page, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserPage'}}}}}
  /internal/v1/admin/users/{id}/block:
    post:
      tags: [Internal Users]
      operationId: adminBlockUser
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Blocked}, '404': {description: User not found}}
components:
  parameters:
    UserId: {name: X-User-Id, in: header, required: false, schema: {type: string, format: uuid, default: '00000000-0000-0000-0000-000000000001'}}
  schemas:
    FriendRequest:
      example: {"userId":"00000000-0000-0000-0000-000000000003"}
      type: "object"
      required: ["userId"]
      properties: {"userId":{"type":"string","format":"uuid"}}
    PublicUserResponse: {type: object, required: [id, displayName], properties: {id: {type: string, format: uuid}, displayName: {type: string}}}
    DeviceRequest:
      example: {"pushToken":"swagger-demo-push-token","platform":"WEB"}
      type: "object"
      required: ["pushToken","platform"]
      properties: {"pushToken":{"type":"string","minLength":8},"platform":{"type":"string","enum":["IOS","ANDROID","WEB"]}}
    DeviceResponse: {type: object, required: [id, platform], properties: {id: {type: string, format: uuid}, platform: {type: string}}}
    RegisterRequest:
      example: {"email":"new-demo@erudit.local","displayName":"Swagger learner"}
      type: object
      required: [email, displayName]
      properties: {email: {type: string, format: email}, displayName: {type: string, minLength: 2, maxLength: 80}}
    VerifyRequest:
      example: {"token":"demo-verification-token"}
      type: object
      required: [token]
      properties: {token: {type: string}}
    UpdateUserRequest:
      example: {"displayName":"Updated learner"}
      type: object
      required: [displayName]
      properties: {displayName: {type: string, minLength: 2, maxLength: 80}}
    UserResponse:
      type: object
      required: [id, email, displayName, verified, createdAt]
      properties: {id: {type: string, format: uuid}, email: {type: string}, displayName: {type: string}, verified: {type: boolean}, createdAt: {type: string, format: date-time}}
    SettingsRequest:
      type: object
      required: [locale, dailyGoal]
      properties: {locale: {type: string}, dailyGoal: {type: integer, minimum: 1, maximum: 100}}
    SettingsResponse:
      allOf:
        - {$ref: '#/components/schemas/SettingsRequest'}
        - {type: object, required: [userId], properties: {userId: {type: string, format: uuid}}}
    UserLookupResponse:
      type: object
      required:
      - id
      - displayName
      - active
      - deviceIds
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        active:
          type: boolean
        deviceIds:
          type: array
          items:
            type: string
            format: uuid
    AdminUserResponse:
      type: object
      required: [id,email,name,registeredAt,status]
      properties: {id: {type: string, format: uuid}, email: {type: string}, name: {type: string}, registeredAt: {type: string, format: date-time}, status: {type: string}}
    AdminUserPage:
      type: object
      required: [data,page,size,total]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/AdminUserResponse'}}, page: {type: integer}, size: {type: integer}, total: {type: integer, format: int64}}
