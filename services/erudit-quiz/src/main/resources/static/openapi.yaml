openapi: 3.0.3
info: {"title": "Erudit Quiz API", "version": "2.0.0", "description": " Demo fixtures require the demo Compose profile. Reset: ./scripts/reset-demo.ps1. Stateful scenarios and IDs: docs/demo-runbook.md."}
tags: [{name: Assessment}, {name: Learning Program}]
paths:
  /api/v1/competitions:
    post:
      tags: [Competitions]
      operationId: createCompetition
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompetitionRequest'}}}}
      responses: {'201': {description: Competition, content: {application/json: {schema: {$ref: '#/components/schemas/CompetitionResponse'}}}}}
  /api/v1/competitions/{id}/invite:
    post:
      tags: [Competitions]
      operationId: inviteCompetition
      parameters: [{$ref: '#/components/parameters/UserId'}, {name: id, in: path, required: true, schema: {type: string, format: uuid, example: '30000000-0000-0000-0000-000000000001'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InviteRequest'}}}}
      responses: {'202': {description: Invited}}
  /api/v1/competitions/{id}/join:
    post: {tags: [Competitions], operationId: joinCompetition, parameters: [{$ref: '#/components/parameters/UserId'}, {name: id, in: path, required: true, schema: {type: string, format: uuid, example: '30000000-0000-0000-0000-000000000001'}}], responses: {'204': {description: Joined}}}
  /api/v1/competitions/{id}/leaderboard:
    get: {tags: [Competitions], operationId: competitionLeaderboard, parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '30000000-0000-0000-0000-000000000001'}}], responses: {'200': {description: Leaderboard, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RatingResponse'}}}}}}}
  /api/v1/ratings:
    get:
      tags: [Ratings]
      operationId: globalRatings
      parameters: [{name: period, in: query, schema: {type: string, enum: [ALL, MONTH, WEEK], default: ALL}}]
      responses: {'200': {description: Ratings, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RatingResponse'}}}}}}
  /api/v1/quizzes:
    get: {tags: [Quizzes], operationId: listQuizzes, responses: {'200': {description: Quizzes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QuizResponse'}}}}}}}
    post:
      tags: [Quiz Authoring]
      operationId: createQuiz
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuizRequest'}}}}
      responses: {'201': {description: Quiz, content: {application/json: {schema: {$ref: '#/components/schemas/QuizResponse'}}}}}
  /api/v1/quizzes/daily:
    get: {tags: [Quizzes], operationId: dailyQuiz, responses: {'200': {description: Daily, content: {application/json: {schema: {$ref: '#/components/schemas/QuizResponse'}}}}}}
  /api/v1/quizzes/{id}/attempts:
    post:
      tags: [Quiz Attempts]
      operationId: startQuiz
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '20000000-0000-0000-0000-000000000001'}}, {$ref: '#/components/parameters/UserId'}]
      responses: {'201': {description: Attempt, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptResponse'}}}}}
  /api/v1/quiz-attempts/{id}/hint:
    post:
      tags: [Quiz Attempts]
      operationId: quizHint
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '52000000-0000-0000-0000-000000000001'}}]
      responses: {'200': {description: Hint, content: {application/json: {schema: {$ref: '#/components/schemas/HintResponse'}}}}}
  /api/v1/quiz-attempts/{id}/submit:
    post:
      tags: [Quiz Attempts]
      operationId: submitQuiz
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '52000000-0000-0000-0000-000000000001'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuizSubmitRequest'}}}}
      responses: {'200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptResponse'}}}}, '409': {description: Already submitted}}
  /api/v1/assessments/questions:
    get: {tags: [Assessment], operationId: listAssessmentQuestions, responses: {'200': {description: Questions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QuestionResponse'}}}}}}}
  /api/v1/assessments/sessions:
    post:
      tags: [Assessment]
      operationId: startAssessment
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses: {'201': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}}
  /api/v1/assessments/sessions/{id}/submit:
    post:
      tags: [Assessment]
      operationId: submitAssessment
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '51000000-0000-0000-0000-000000000002'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmitRequest'}}}}
      responses: {'200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/ResultResponse'}}}}, '409': {description: Already submitted}}
  /api/v1/assessments/sessions/{id}/result:
    get:
      tags: [Assessment]
      operationId: getAssessmentResult
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '51000000-0000-0000-0000-000000000001'}}]
      responses: {'200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/ResultResponse'}}}}}
  /api/v1/learning-program:
    get:
      tags: [Learning Program]
      operationId: getLearningProgram
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses: {'200': {description: Program, content: {application/json: {schema: {$ref: '#/components/schemas/ProgramResponse'}}}}}
  /api/v1/learning-program/next:
    get:
      tags: [Learning Program]
      operationId: getNextLearningStep
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses: {'200': {description: Step, content: {application/json: {schema: {$ref: '#/components/schemas/StepResponse'}}}}}
components:
  parameters:
    UserId: {name: X-User-Id, in: header, required: false, schema: {type: string, format: uuid, default: '00000000-0000-0000-0000-000000000001'}}
  schemas:
    CompetitionRequest:
      example: {"title":"Swagger competition"}
      type: "object"
      required: ["title"]
      properties: {"title":{"type":"string","minLength":2,"maxLength":160}}
    CompetitionResponse: {type: object, required: [id,title,ownerId,status], properties: {id: {type: string, format: uuid}, title: {type: string}, ownerId: {type: string, format: uuid}, status: {type: string}}}
    InviteRequest:
      example: {"userId":"00000000-0000-0000-0000-000000000002"}
      type: "object"
      required: ["userId"]
      properties: {"userId":{"type":"string","format":"uuid"}}
    RatingResponse: {type: object, required: [userId,score,position], properties: {userId: {type: string, format: uuid}, score: {type: integer}, position: {type: integer}}}
    QuizRequest:
      example: {"title":"Swagger quiz","prompt":"Two plus three?","options":["4","5","6"],"correctIndex":1,"hint":"More than four"}
      type: "object"
      required: ["title","prompt","options","correctIndex","hint"]
      properties: {"title":{"type":"string"},"prompt":{"type":"string"},"options":{"type":"array","minItems":2,"items":{"type":"string"}},"correctIndex":{"type":"integer","minimum":0},"hint":{"type":"string"}}
    QuizResponse: {type: object, required: [id, title], properties: {id: {type: string, format: uuid}, title: {type: string}}}
    QuizSubmitRequest:
      example: {"optionIndex":1}
      type: "object"
      required: ["optionIndex"]
      properties: {"optionIndex":{"type":"integer","minimum":0}}
    AttemptResponse: {type: object, required: [id, status, hintsUsed], properties: {id: {type: string, format: uuid}, status: {type: string}, score: {type: integer, nullable: true}, hintsUsed: {type: integer}}}
    HintResponse: {type: object, required: [hint, remaining], properties: {hint: {type: string}, remaining: {type: integer}}}
    QuestionResponse:
      type: object
      required: [id, prompt, options]
      properties: {id: {type: string, format: uuid}, prompt: {type: string}, options: {type: array, items: {type: string}}}
    SessionResponse:
      type: object
      required: [id, userId, status]
      properties: {id: {type: string, format: uuid}, userId: {type: string, format: uuid}, status: {type: string}}
    AnswerRequest:
      type: object
      required: [questionId, optionIndex]
      properties: {questionId: {type: string, format: uuid}, optionIndex: {type: integer, minimum: 0}}
    SubmitRequest:
      example: {"answers":[{"questionId":"10000000-0000-0000-0000-000000000001","optionIndex":1},{"questionId":"10000000-0000-0000-0000-000000000002","optionIndex":1}]}
      type: object
      required: [answers]
      properties: {answers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/AnswerRequest'}}}
    ResultResponse:
      type: object
      required: [sessionId, score, grade]
      properties: {sessionId: {type: string, format: uuid}, score: {type: integer}, grade: {type: string}}
    ProgramResponse:
      type: object
      required: [userId, grade, progress]
      properties: {userId: {type: string, format: uuid}, grade: {type: string}, progress: {type: integer}}
    StepResponse:
      type: object
      required: [code, title]
      properties: {code: {type: string}, title: {type: string}}
