openapi: 3.0.3
info:
  title: Erudit Payment API
  version: 2.0.0
paths:
  /api/v1/subscriptions:
    post:
      tags:
      - Subscriptions
      operationId: createSubscription
      summary: Оформить подписку
      description: Создаёт платёж через провайдера и активирует подписку после успешной
        оплаты.
      x-task-id: 86
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequest'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-User-Id
        in: header
        description: Unverified demo context; no authorization in lab 2.
        schema:
          type: string
          format: uuid
          default: 00000000-0000-0000-0000-000000000001
  /api/v1/subscriptions/me:
    get:
      tags:
      - Subscriptions
      operationId: getMySubscription
      summary: Статус подписки
      description: Возвращает актуальный статус последней подписки текущего пользователя.
      x-task-id: 86
      x-implementation-status: implemented
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-User-Id
        in: header
        description: Unverified demo context; no authorization in lab 2.
        schema:
          type: string
          format: uuid
          default: 00000000-0000-0000-0000-000000000001
  /api/v1/subscriptions/{id}/cancel:
    post:
      tags:
      - Subscriptions
      operationId: cancelSubscription
      summary: Отменить подписку
      description: Отменяет принадлежащую текущему пользователю активную подписку.
      x-task-id: 86
      x-implementation-status: implemented
      parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор ресурса
        schema: &id001
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        description: Unverified demo context; no authorization in lab 2.
        schema:
          type: string
          format: uuid
          default: 00000000-0000-0000-0000-000000000001
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/subscriptions/payments:
    get:
      tags:
      - Payments
      operationId: listPayments
      summary: История платежей
      description: Возвращает постраничную историю платежей без платёжных реквизитов.
      x-task-id: 86
      x-implementation-status: implemented
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: X-User-Id
        in: header
        description: Unverified demo context; no authorization in lab 2.
        schema:
          type: string
          format: uuid
          default: 00000000-0000-0000-0000-000000000001
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
          headers:
            X-Total-Count:
              description: Total payments for this user
              schema:
                type: integer
                format: int64
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/subscriptions/plans:
    get:
      tags:
      - Subscriptions
      operationId: listSubscriptionPlans
      summary: Доступные тарифы
      description: Реализовано в задаче 66. Возвращает только доступные для оформления
        тарифы в стабильном порядке.
      x-task-id: 86
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Тарифы для оформления подписки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanListResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/entitlements/{userId}:
    get:
      tags:
      - Entitlements
      operationId: getEntitlement
      x-task-id: 86
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Premium entitlement; never grants expired access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementResponse'
components:
  schemas:
    EntitlementResponse:
      type: object
      required:
      - userId
      - premium
      properties:
        userId:
          type: string
          format: uuid
        premium:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
    SubscriptionCreateRequest:
      type: object
      properties:
        plan:
          type: string
          example: PREMIUM_MONTHLY
        paymentMethodId:
          type: string
          example: mock_card
      required:
      - plan
      - paymentMethodId
    SubscriptionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SubscriptionDataResponse'
      required:
      - data
    SubscriptionDataResponse:
      type: object
      properties:
        id: *id001
        plan:
          type: string
        status:
          type: string
        expiresAt: &id002
          type: string
          format: date-time
      required:
      - id
      - status
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorDetailResponse'
      required:
      - error
    ApiErrorDetailResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    PaymentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentDataResponse'
        pagination:
          $ref: '#/components/schemas/PageMetadataResponse'
      required:
      - data
    PaymentDataResponse:
      type: object
      properties:
        id: *id001
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
        status:
          type: string
        paidAt: *id002
      required:
      - id
      - status
    PageMetadataResponse:
      type: object
      properties:
        page: &id003
          type: integer
          format: int32
        size: *id003
        totalElements:
          type: integer
          format: int64
        totalPages: *id003
      required:
      - page
      - size
      - totalElements
      - totalPages
    SubscriptionPlanListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPlanDataResponse'
    SubscriptionPlanDataResponse:
      type: object
      required:
      - code
      - name
      - price
      - currency
      - period
      properties:
        code:
          type: string
        name:
          type: string
        price:
          type: string
          description: Десятичная сумма без потери точности
        currency:
          type: string
        period:
          type: string
