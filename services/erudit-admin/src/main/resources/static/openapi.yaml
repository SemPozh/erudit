openapi: 3.0.3
info: {"title": "Erudit Admin API", "version": "2.0.0", "description": "Lab 2 teaching mode; no authorization or ADMIN role checks. Demo fixtures require the demo Compose profile. Reset: ./scripts/reset-demo.ps1. Stateful scenarios and IDs: docs/demo-runbook.md."}
paths:
  /api/v1/admin/content/moderation:
    get:
      tags: [Admin]
      operationId: listModerationQueue
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentListResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/{id}/approve:
    post:
      tags: [Admin]
      operationId: approveContent
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid, example: '11000000-0000-0000-0000-000000000002'}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentItemResponse'}}}}, '409': {description: Контент уже был обработан модератором, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/{id}/reject:
    post:
      tags: [Admin]
      operationId: rejectContent
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid, example: '11000000-0000-0000-0000-000000000002'}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentItemResponse'}}}}, '409': {description: Контент уже был обработан модератором, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/reports:
    get:
      tags: [Admin]
      operationId: listContentReports
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentReportListResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/reports/{id}/resolve:
    post:
      tags: [Admin]
      operationId: resolveContentReport
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid, example: '12000000-0000-0000-0000-000000000001'}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportResolutionRequest'}}}}
      responses: {'204': {description: Операция выполнена}, '409': {description: Жалоба уже была рассмотрена, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: query, in: query, required: false, schema: {type: string}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserListResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/users/{id}/block:
    post:
      tags: [Admin]
      operationId: blockUser
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid, example: '00000000-0000-0000-0000-000000000001'}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'204': {description: Операция выполнена}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/notifications/send-many:
    post:
      tags: [Admin]
      operationId: sendManyNotifications
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationSendManyRequest'}}}}
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/CountResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
      parameters: [{name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
  /api/v1/admin/audit:
    get:
      tags: [Admin]
      operationId: listAuditLog
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
      x-task-id: 90
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: actorId, in: query, required: false, schema: {type: string, format: uuid}}, {name: action, in: query, required: false, schema: {type: string}}, {name: from, in: query, required: false, schema: {type: string, format: date-time}}, {name: to, in: query, required: false, schema: {type: string, format: date-time}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Страница записей аудита, content: {application/json: {schema: {$ref: '#/components/schemas/AuditListResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/users/{id}/subscription:
    get:
      tags: [Admin]
      operationId: viewUserSubscription
      x-task-id: 90
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '00000000-0000-0000-0000-000000000001'}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Payment view through Feign, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionResponse'}}}}, default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
  /api/v1/admin/users/{id}/payments:
    get:
      tags: [Admin]
      operationId: viewUserPayments
      x-task-id: 90
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid, example: '00000000-0000-0000-0000-000000000001'}}, {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified actor context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Payment view through Feign, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentListResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
      description: 'Lab 2 teaching mode: no authorization or ADMIN role check. Calls domain services through Feign; operation result and request ID are audited locally.'
components:
  schemas:
    ContentListResponse:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/ContentItemDataResponse'}}, pagination: {$ref: '#/components/schemas/PageMetadataResponse'}}
      required: [data]
    ContentItemDataResponse:
      type: object
      properties: {id: {type: string, format: uuid}, categoryId: {type: string, format: uuid}, type: {type: string, enum: [ARTICLE, FACT_CARD, AUDIO, VIDEO, COMBINED, QUIZ_BLOCK]}, title: {type: string, minLength: 1, maxLength: 250}, description: {type: string, maxLength: 2000}, body: {type: string}, mediaUrl: {type: string, nullable: true}, difficulty: {type: string}, estimatedMinutes: {type: integer, format: int32}, authorId: {type: string, nullable: true}, status: {type: string}, tags: {type: array, items: {type: string}}, premiumLocked: {type: boolean}}
      required: [id, type, title, status]
    PageMetadataResponse:
      type: object
      properties: {page: {type: integer, format: int32}, size: {type: integer, format: int32}, totalElements: {type: integer, format: int64}, totalPages: {type: integer, format: int32}}
      required: [page, size, totalElements, totalPages]
    ErrorResponse:
      type: object
      properties: {error: {$ref: '#/components/schemas/ApiErrorDetailResponse'}, requestId: {type: string}, details: {type: object, additionalProperties: true}}
      required: [error]
    ApiErrorDetailResponse:
      type: object
      properties: {code: {type: string}, message: {type: string}}
      required: [code, message]
    ContentItemResponse:
      type: object
      properties: {data: {$ref: '#/components/schemas/ContentItemDataResponse'}}
      required: [data]
    ContentReportListResponse:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/ContentReportItemDataResponse'}}, pagination: {$ref: '#/components/schemas/PageMetadataResponse'}}
      required: [data]
    ContentReportItemDataResponse:
      type: object
      properties: {id: {type: string, format: uuid}, contentId: {type: string, format: uuid}, reason: {type: string}, status: {type: string}, createdAt: {type: string, format: date-time}}
      required: [id, contentId, status]
    ReportResolutionRequest:
      example: {"decision":"REJECT","comment":"Demo reviewed"}
      type: object
      properties: {decision: {type: string, enum: [ACCEPT, REJECT]}, comment: {type: string}}
      required: [decision]
    AdminUserListResponse:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/UserProfileDataResponse'}}, pagination: {$ref: '#/components/schemas/PageMetadataResponse'}}
      required: [data]
    UserProfileDataResponse:
      type: object
      properties: {id: {type: string, format: uuid}, email: {type: string, format: email}, name: {type: string}, avatarUrl: {type: string, nullable: true}, registeredAt: {type: string, format: date-time}, status: {type: string}}
      required: [id, email, name]
    NotificationSendManyRequest:
      example: {"userIds":["00000000-0000-0000-0000-000000000001"],"templateId":"40000000-0000-0000-0000-000000000001","parameters":{}}
      type: object
      properties: {userIds: {type: array, items: {type: string, format: uuid}, minItems: 1, maxItems: 1000}, templateId: {type: string, format: uuid}, parameters: {type: object, additionalProperties: {type: string}}}
      required: [userIds, templateId]
    CountResponse:
      type: object
      properties: {data: {$ref: '#/components/schemas/CountDataResponse'}}
      required: [data]
    CountDataResponse:
      type: object
      properties: {count: {type: integer, format: int64}}
      required: [count]
    AuditListResponse:
      type: object
      required: [data, pagination]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/AuditRecordDataResponse'}}, pagination: {$ref: '#/components/schemas/PageMetadataResponse'}}
    AuditRecordDataResponse:
      type: object
      required: [id, actorId, action, occurredAt]
      properties: {id: {type: string, format: uuid}, actorId: {type: string, format: uuid}, action: {type: string}, targetType: {type: string}, targetId: {type: string}, occurredAt: {type: string, format: date-time}, metadata: {type: object, additionalProperties: true}}
    SubscriptionResponse:
      type: object
      properties: {data: {$ref: '#/components/schemas/SubscriptionDataResponse'}}
      required: [data]
    SubscriptionDataResponse:
      type: object
      properties: {id: {type: string, format: uuid}, plan: {type: string}, status: {type: string}, expiresAt: {type: string, format: date-time}}
      required: [id, status]
    PaymentListResponse:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/PaymentDataResponse'}}, pagination: {$ref: '#/components/schemas/PageMetadataResponse'}}
      required: [data]
    PaymentDataResponse:
      type: object
      properties: {id: {type: string, format: uuid}, amount: {type: number, format: double, minimum: 0}, currency: {type: string}, status: {type: string}, paidAt: {type: string, format: date-time}}
      required: [id, status]
