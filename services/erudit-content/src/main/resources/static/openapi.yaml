openapi: 3.0.3
info:
  title: Erudit Content API
  version: 2.0.0
servers:
  - url: /
tags:
  - name: Categories
    description: Content category management
  - name: Content
  - name: Media
paths:
  /api/v1/content:
    get:
      tags: [Content]
      operationId: listContent
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: categoryId, in: query, schema: {type: string, format: uuid}}
        - {name: type, in: query, schema: {type: string}}
        - {name: difficulty, in: query, schema: {type: string}}
        - {name: premium, in: query, schema: {type: boolean}}
        - {name: query, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: ['createdAt,desc','createdAt,asc','title,asc','title,desc','estimatedMinutes,asc','estimatedMinutes,desc'], default: 'createdAt,desc'}}
      responses:
        '200':
          description: Published content page
          headers: {X-Total-Count: {schema: {type: integer, format: int64}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ContentListResponse'}}}
    post:
      tags: [Content]
      operationId: createContent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContentRequest'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ContentResponse'}}}}
  /api/v1/content/formats:
    get:
      tags: [Content]
      operationId: listFormats
      responses:
        '200': {description: Supported formats, content: {application/json: {schema: {$ref: '#/components/schemas/FormatListResponse'}}}}
  /api/v1/content/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Content]
      operationId: getContent
      responses:
        '200': {description: Content, content: {application/json: {schema: {$ref: '#/components/schemas/ContentResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Content]
      operationId: updateContent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContentRequest'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/ContentResponse'}}}}
    delete:
      tags: [Content]
      operationId: archiveContent
      responses: {'204': {description: Archived}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/v1/media:
    post:
      tags: [Media]
      operationId: uploadMedia
      requestBody:
        required: true
        content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}
      responses:
        '201': {description: Uploaded, content: {application/json: {schema: {$ref: '#/components/schemas/MediaResponse'}}}}
  /api/v1/media/{id}:
    get:
      tags: [Media]
      operationId: getMedia
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: File, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/content/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Category page
          headers:
            X-Total-Count: {schema: {type: integer, format: int64}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/CategoryListResponse'}}
    post:
      tags: [Categories]
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryRequest'}
            example: {name: Astronomy}
      responses:
        '201':
          description: Category created
          content:
            application/json: {schema: {$ref: '#/components/schemas/CategoryResponse'}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/content/categories/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Categories]
      operationId: getCategory
      responses:
        '200':
          description: Category
          content:
            application/json: {schema: {$ref: '#/components/schemas/CategoryResponse'}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Categories]
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CategoryRequest'}}
      responses:
        '200':
          description: Category updated
          content:
            application/json: {schema: {$ref: '#/components/schemas/CategoryResponse'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Categories]
      operationId: deleteCategory
      responses:
        '204': {description: Category deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/content/{id}/report:
    post:
      tags: [Content Workflows]
      operationId: reportContent
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContentReportRequest'}}}}
      responses: {'201': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ReportCreatedResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/content/feed:
    get:
      tags: [Content Workflows]
      operationId: getContentFeed
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, headers: {X-Has-More: {description: Есть ли следующая страница, schema: {type: boolean}}, X-Next-Page: {description: Номер следующей страницы; отсутствует на последней странице, schema: {type: integer, minimum: 0}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ContentFeedResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/content/{id}/quiz-cards:
    get:
      tags: [Content Workflows]
      operationId: getContentQuizCards
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/QuizCardListResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/content/{id}/progress:
    get:
      tags: [Content Workflows]
      operationId: getContentProgress
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentProgressResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/content/{id}/view:
    post:
      tags: [Content Workflows]
      operationId: markContentViewed
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentProgressResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/content/{id}/complete:
    post:
      tags: [Content Workflows]
      operationId: completeContent
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentProgressResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/moderation:
    get:
      tags: [Content Workflows]
      operationId: listModerationQueue
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowContentPageResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/{id}/approve:
    post:
      tags: [Content Workflows]
      operationId: approveContent
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentResponse'}}}}, '409': {description: Контент уже был обработан модератором, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/{id}/reject:
    post:
      tags: [Content Workflows]
      operationId: rejectContent
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentResponse'}}}}, '409': {description: Контент уже был обработан модератором, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/reports:
    get:
      tags: [Content Workflows]
      operationId: listContentReports
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentReportListResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /api/v1/admin/content/reports/{id}/resolve:
    post:
      tags: [Content Workflows]
      operationId: resolveContentReport
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportResolutionRequest'}}}}
      responses: {'204': {description: Операция выполнена}, '409': {description: Жалоба уже была рассмотрена, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /internal/v1/moderation:
    post:
      tags: [Content Workflows]
      operationId: moderateInternal
      x-task-id: 78
      parameters: [{name: X-User-Id, in: header, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InternalModerationRequest'}}}}
      responses: {'200': {description: Moderated, content: {application/json: {schema: {$ref: '#/components/schemas/InternalModerationResponse'}}}}}
  /internal/v1/content/moderation:
    get:
      tags: [Content Workflows]
      operationId: internalListModerationQueue
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowContentPageResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /internal/v1/content/reports:
    get:
      tags: [Content Workflows]
      operationId: internalListContentReports
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}, {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      responses: {'200': {description: Успешный ответ, content: {application/json: {schema: {$ref: '#/components/schemas/ContentReportListResponse'}}}, headers: {X-Total-Count: {schema: {type: integer, format: int64}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
  /internal/v1/content/reports/{id}/resolve:
    post:
      tags: [Content Workflows]
      operationId: internalResolveContentReport
      description: Content service workflow. Lab 2 uses unverified X-User-Id; no authorization or role checks.
      x-task-id: 78
      x-implementation-status: implemented
      parameters: [{name: id, in: path, required: true, description: Идентификатор ресурса, schema: {type: string, format: uuid}}, {name: X-User-Id, in: header, description: Unverified demo context, schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000001}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportResolutionRequest'}}}}
      responses: {'204': {description: Операция выполнена}, '409': {description: Жалоба уже была рассмотрена, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, default: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    Conflict:
      description: Conflict
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
  schemas:
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, pattern: '.*\S.*', example: Astronomy}
    CategoryDataResponse:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid, example: 10000000-0000-0000-0000-000000000001}
        name: {type: string, example: Science}
    CategoryResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/CategoryDataResponse'}
    CategoryListResponse:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CategoryDataResponse'}}
        pagination: {$ref: '#/components/schemas/PageMetadataResponse'}
    PageMetadataResponse:
      type: object
      required: [page, size, total]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, format: int64, minimum: 0}
    ContentRequest:
      type: object
      required: [categoryId, type, title, description, body, difficulty, estimatedMinutes, premiumLocked, tags]
      properties:
        categoryId: {type: string, format: uuid}
        type: {type: string, enum: [ARTICLE, FACT_CARD, AUDIO, VIDEO, COMBINED, QUIZ_BLOCK]}
        title: {type: string, minLength: 1, maxLength: 250}
        description: {type: string, minLength: 1, maxLength: 2000}
        body: {type: string, minLength: 1}
        mediaUrl: {type: string, maxLength: 1000}
        difficulty: {type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED]}
        estimatedMinutes: {type: integer, minimum: 1, maximum: 1440}
        premiumLocked: {type: boolean}
        tags: {type: array, maxItems: 20, items: {type: string, maxLength: 100}}
    ContentDataResponse:
      description: Premium description, body and media are visible only with payment entitlement. Otherwise text is replaced with Premium content. X-User-Id is an unverified demo context.
      allOf:
        - {$ref: '#/components/schemas/ContentRequest'}
        - {type: object, required: [id, status, createdAt], properties: {id: {type: string, format: uuid}, status: {type: string}, createdAt: {type: string, format: date-time}}}
    ContentResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/ContentDataResponse'}}
    ContentListResponse:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ContentDataResponse'}}
        pagination: {$ref: '#/components/schemas/PageMetadataResponse'}
    FormatListResponse:
      type: object
      required: [data]
      properties: {data: {type: array, items: {type: string}}}
    MediaResponse:
      type: object
      required: [id, url, contentType, size]
      properties:
        id: {type: string, format: uuid}
        url: {type: string}
        contentType: {type: string}
        size: {type: integer, format: int64}
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: {type: integer}
        message: {type: string}
    ContentReportRequest:
      type: object
      properties: {reason: {type: string, minLength: 10, maxLength: 500, pattern: .*\S.*, example: В материале есть фактическая ошибка}}
      required: [reason]
    ReportCreatedResponse:
      type: object
      properties: {data: {type: string, format: uuid}}
      required: [data]
    QuizCardListResponse:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/QuizCardDataResponse'}}, pagination: {$ref: '#/components/schemas/WorkflowPageMetadata'}}
      required: [data]
    QuizCardDataResponse:
      type: object
      properties: {id: {type: string, format: uuid}, fact: {type: string, description: 'Факт из исходного материала, на котором основан вопрос'}, question: {type: string}, answers: {type: array, items: {type: string}}}
      required: [id, fact, question, answers]
    ContentProgressResponse:
      type: object
      properties: {data: {$ref: '#/components/schemas/ContentProgressDataResponse'}}
      required: [data]
    ContentProgressDataResponse:
      type: object
      properties: {contentId: {type: string, format: uuid}, status: {type: string}, viewedAt: &wf385id001 {type: string, format: date-time}, completedAt: *wf385id001}
      required: [contentId, status]
    ContentReportListResponse:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/ContentReportItemDataResponse'}}, pagination: {$ref: '#/components/schemas/WorkflowPageMetadata'}}
      required: [data]
    ContentReportItemDataResponse:
      type: object
      properties: {id: &wf393id001 {type: string, format: uuid}, contentId: *wf393id001, reason: {type: string}, status: {type: string}, createdAt: {type: string, format: date-time}}
      required: [id, contentId, status]
    ReportResolutionRequest:
      type: object
      properties: {decision: {type: string, enum: [ACCEPT, REJECT]}, comment: {type: string, maxLength: 2000}}
      required: [decision]
    ContentFeedResponse:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/ContentDataResponse'}}}
    WorkflowPageMetadata:
      type: object
      properties: {page: &wf405id001 {type: integer, format: int32}, size: *wf405id001, totalElements: {type: integer, format: int64}, totalPages: *wf405id001}
      required: [page, size, totalElements, totalPages]
    WorkflowContentPageResponse:
      type: object
      required: [data, pagination]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/ContentDataResponse'}}, pagination: {$ref: '#/components/schemas/WorkflowPageMetadata'}}
    InternalModerationRequest:
      type: object
      required: [contentId, status]
      properties: {contentId: {type: string, format: uuid}, status: {type: string, enum: [PUBLISHED, REJECTED]}, reason: {type: string, maxLength: 2000}}
    InternalModerationResponse:
      type: object
      required: [contentId, status]
      properties: {"contentId": {"type": "string", "format": "uuid"}, "status": {"type": "string"}, "reason": {"type": "string"}, "data": {"$ref": "#/components/schemas/ContentDataResponse"}}
